spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/calendrier_foyer
    username: ${DB_USER:calendrier_user}
    password: ${DB_PASSWORD:calendrier_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8084
