spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/calendrier_foyer
    username: ${DB_USER:calendrier_user}
    password: ${DB_PASSWORD:calendrier_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8084

app:
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8180,https://*:8280).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
